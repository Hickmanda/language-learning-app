version: "3.9"

services:
  web:
    build: .
    container_name: language_app
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=dev-only-secret-change-in-production
      - FLASK_APP=app.py
    volumes:
      # Persist the SQLite database outside the container
      - ./instance:/app/instance
    restart: unless-stopped