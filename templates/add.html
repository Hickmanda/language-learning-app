{% extends 'base.html' %}
{% block content %}

<h1>{{ t.add_card }}</h1>

<form method="POST" class="form-card">
    <label>{{ t.word }}:</label>
    <input type="text" name="word" required>

    <label>{{ t.translation }}:</label>
    <input type="text" name="translation" required>

    <label>{{ t.language }} ({{ t.learning_language }}):</label>
    <select name="language" required>
        {% for code, info in LANGUAGES.items() %}
            <option value="{{ code }}" {% if code == learn_lang %}selected{% endif %}>
                {{ info.code }} — {{ info.native }}
            </option>
        {% endfor %}
    </select>

    <label>{{ t.base_language }}:</label>
    <select name="base_language" required>
        {% for code, info in LANGUAGES.items() %}
            <option value="{{ code }}" {% if code == base_lang %}selected{% endif %}>
                {{ info.code }} — {{ info.native }}
            </option>
        {% endfor %}
    </select>

    <button type="submit" class="btn-primary">{{ t.add }}</button>
</form>

{% endblock %}
